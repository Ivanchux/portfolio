<header class="cabecera">
  <div class="contenedor cabecera__barra cristal">
    <a class="marca" href="{{raiz}}./"><span class="marca__logo" aria-hidden="true"></span>{{nombre_publico}}<span>{{alias}}</span></a>
    <div class="cabecera__fin">
      <nav aria-label="Principal">
        <ul class="menu">
          {{{menu}}}
        </ul>
      </nav>
      <a class="idioma" href="{{otro_idioma}}" hreflang="{{otro_lang}}" lang="{{otro_lang}}" aria-label="{{otro_nombre}}">{{otro_texto}}</a>
      <button class="cambio-tema" type="button" id="cambio-tema" hidden aria-pressed="false" aria-label="Modo oscuro">
        <svg class="icono sol" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
        <svg class="icono luna" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </div>
</header>
